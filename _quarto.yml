project:
  type: website
  output-dir: _site

website:
  title: "Thai Luu"
  description: "SLAM, Gaussian splatting and 4D reconstruction: derived on paper, checked in code."
  site-url: https://zerokhong1.github.io/blog/
  repo-url: https://github.com/zerokhong1/blog
  navbar:
    right:
      - text: Posts
        href: index.qmd
      - about.qmd
      - icon: github
        href: https://github.com/zerokhong1
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS feed
  page-footer:
    left: "Thai Luu"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    html-math-method: katex
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    fig-cap-location: bottom
    link-external-newwindow: true

execute:
  freeze: auto
