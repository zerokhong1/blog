project:
  type: website
  output-dir: _site
  resources:
    - assets/fonts/

website:
  title: "Thai Luu"
  description: "Notes from learning SLAM with 3D Gaussian Splatting: derived on paper, checked in code."
  site-url: https://zerokhong1.github.io/blog/
  repo-url: https://github.com/zerokhong1/blog
  favicon: assets/mark.svg
  open-graph: true
  twitter-card: true
  navbar:
    logo: assets/mark.svg
    title: "Thai Luu"
    right:
      - text: Posts
        href: index.qmd
      - about.qmd
      - icon: github
        href: https://github.com/zerokhong1
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/congthaineur/
        aria-label: LinkedIn
  page-footer:
    left: "Thai Luu"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [default, theme/base.scss, theme/light.scss]
      dark: [default, theme/base.scss, theme/dark.scss]
    respect-user-color-scheme: true
    css: assets/fonts.css
    lang: en
    toc: true
    grid:
      body-width: 680px
      margin-width: 260px
      gutter-width: 2rem
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/"
    code-copy: true
    code-overflow: scroll
    highlight-style: github
    fig-cap-location: bottom
    link-external-newwindow: true

execute:
  freeze: auto
